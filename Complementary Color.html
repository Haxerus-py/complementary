<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Complementary Color Viewer</title>
        <link rel="icon" type="image/png" href="Complementary Logo.png">
        <link rel="stylesheet" type="text/css" href="Complementary Color.css">
    </head>

    <body style="background-color: bisque;">
        <img id="logo" src="Complementary Logo.png">

        <h1 id="heading">Color</h1>
        <div class="container">
            <div>
                <h2 id="mainHeading">Main Color</h2>
                <div id="MainColor"></div>
                <p id="mainLabel">RGB Code: rgb(255,255,255)</p>
            </div>
            <div>
                <h2 id="compHeading">Complementary Color</h2>
                <div id="CompColor"></div>
                <p id="compLabel">RGB Code: rgb(255,255,255)</p>
            </div>    
        </div>

        <div id="buttons">
            <button id="random">Random</button>
            <button id="choose">Choose</button>
        </div>

        <footer id="footer"> &copy; 2026, Chiemeka Obialo</footer>

        <script src="Complementary Color Finder.js"></script>
    </body>


</html>
